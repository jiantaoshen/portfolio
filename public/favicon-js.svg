<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JS favicon">
  <title>JS favicon — bold path overlap</title>

  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- J: thick open stroke -->
  <path
    d="M128 132H274V312C274 372 239 408 184 408C137 408 103 385 86 347"
    fill="none"
    stroke="#3b82f6"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- S: overlaps the right side of J -->
  <path
    d="M405 166H316C271 166 243 189 243 225C243 262 274 282 319 282H342C387 282 414 304 414 340C414 381 382 406 333 406H238"
    fill="none"
    stroke="#6b7280"
    stroke-width="60"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
